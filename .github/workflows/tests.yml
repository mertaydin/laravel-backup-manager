name: Tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, zip, pdo_mysql, pdo_sqlite
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer ide-helper:generate
      - run: composer ide-helper:meta
      - run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Collect Pint formatting diff
        run: |
          vendor/bin/pint src tests
          git diff -- src tests
      - run: vendor/bin/pint --test
      - run: composer audit --no-interaction
      - run: vendor/bin/phpunit
